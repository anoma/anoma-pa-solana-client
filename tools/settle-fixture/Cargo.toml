[package]
name = "settle-fixture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Settle a protocol-adapter fixture on a cluster using the client crate's builders"
repository.workspace = true
publish = false

[dependencies]
anoma-pa-solana-client = { path = "../../rust" }
base64 = "0.22"
bincode = "1.3.3"
bs58 = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-address-lookup-table-interface = { version = "3", features = ["bincode"] }
solana-client = "4"
solana-commitment-config = "3"
solana-ed25519-program = "3"
solana-sdk = "4"
solana-transaction-status-client-types = "4"
