[package]
name = "settle-fixture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Settle a protocol-adapter fixture on a cluster using the client crate's builders"
repository.workspace = true
publish = false

[dependencies]
# Reads the generated account types (`AccountDeserialize`).
anchor = { workspace = true }
anoma-pa-solana-client = { path = "../../rust" }
base64 = "0.22"
bs58 = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-client = "4"
solana-commitment-config = "3"
solana-sdk = "4"
solana-transaction-status-client-types = "4"
