[workspace]
members = ["rust", "tools/settle-fixture"]
resolver = "2"

[workspace.package]
version = "0.12.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/anoma/anoma-pa-solana-client"

[workspace.dependencies]
# Renamed so that the client's `generated` can give `declare_program!` its own
# `anchor_lang`, with the IDL's `u256` added. 1.2.2 is the first release with
# solana-foundation/anchor#4737.
anchor = { package = "anchor-lang", version = "1.2.2" }
