[package]
name = "anoma-pa-solana-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client bindings for the Solana Anoma Protocol Adapter"
repository.workspace = true
readme = "../README.md"
# The tests that check the crate against the repository's files outside it
# (`fixtures/`, `PA_TAG.txt`): the published crate does not carry those.
exclude = [
  "tests/events_fixture.rs",
  "tests/instructions_fixture.rs",
  "tests/idl_at_tag.rs",
  "tests/estimate_deployed.rs",
]

[lib]
path = "src/lib.rs"

[dependencies]
# Pure deps — no Solana SDK, compile for any target including the risc0 guest.
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"

# Solana SDK deps — used only by the generated bindings and the instruction,
# PDA, event and settlement code over them. Optional so that consumers needing
# only the pure wire-format and crypto modules (e.g. the zkVM transfer circuit,
# which compiles for riscv32im-risc0-zkvm-elf) can depend on this crate with
# `default-features = false`. These are the Solana crate versions the programs
# build with (Anchor 1.2): pubkey, instruction and sdk-ids 3.
#
# The bindings `declare_program!` generates from `idls/protocol_adapter.json`.
anchor = { workspace = true, optional = true }
solana-instruction = { version = "3", optional = true }
# The settlement's v1 transaction messages.
solana-message = { version = "4", optional = true }
# `curve25519`: PDA derivation (`Pubkey::find_program_address`).
solana-pubkey = { version = "3", optional = true, features = ["curve25519"] }
solana-sdk-ids = { version = "3", optional = true }
# The deployment record: each cluster's genesis hash, its chain id's source.
serde_json = { version = "1.0", optional = true }
solana-cluster-type = { version = "3", optional = true }

# The settlement input (`arm` feature): a proven ARM transaction in the form
# the adapter settles. Without the prover: no `prove` feature.
anoma-rm-risc0 = { version = "2.0.0-rc.8.1", default-features = false, features = ["transaction"], optional = true }
risc0-zkvm = { version = "3.0.3", default-features = false, optional = true }

# Submission (`rpc` feature): the adapter's state and the forwarders' accounts
# read over an RPC, and the reads simulated there.
solana-rpc-client = { version = "4", optional = true }
solana-rpc-client-api = { version = "4", optional = true }
solana-signature = { version = "3", optional = true }
solana-transaction = { version = "4", optional = true }
solana-transaction-error = { version = "3", optional = true }
# Decodes the return data of a simulated read.
base64 = { version = "0.22", optional = true }
# The instance's errors (`error`), derived as pa-evm's bindings derive theirs.
thiserror = { version = "2", optional = true }

# Estimate (`estimate` feature): a settlement run in a local SVM on the
# cluster's accounts as of one read, with the cluster's active features.
litesvm = { version = "0.18.2", features = ["precompiles"], optional = true }
agave-feature-set = { version = "4.3.2", optional = true }
solana-program-runtime = { version = "4.3.2", optional = true }
solana-account = { version = "4", optional = true }
solana-clock = { version = "3", features = ["serde"], optional = true }
solana-feature-gate-interface = { version = "4", features = ["serde"], optional = true }
solana-loader-v3-interface = { version = "8", optional = true }

[build-dependencies]
# Reads the adapter IDL's errors for `build.rs`.
serde_json = "1.0"
# The case conversion `declare_program!` names the error enum with.
heck = "0.5"

# The event types it decodes the fixture as are the generated ones.
[[test]]
name = "events_fixture"
required-features = ["solana"]

[[test]]
name = "instructions_fixture"
required-features = ["solana"]

# Reads a record through the public `addresses` API.
[[test]]
name = "deployment_record"
required-features = ["solana"]

[[test]]
name = "deployed"
required-features = ["rpc"]

# Reads `fixtures/devnet_settlement.json`.
[[test]]
name = "estimate_deployed"
required-features = ["estimate"]

[dev-dependencies]
# Read the vendored IDL and the cross-package fixtures under `fixtures/`.
serde_json = "1.0"
base64 = "0.22"
# Proves trivial actions for the settlement-input tests.
anoma-pa-testkit = { version = "=1.0.0-rc.7", features = ["local", "fixtures"] }
tokio = { version = "1", features = ["macros", "rt"] }
# Serializes a v1 message to check `transaction_size` against it.
solana-message = { version = "4", features = ["wincode"] }

[features]
default = ["solana"]
# Enables the modules that depend on the Solana SDK: the generated bindings,
# instruction builders, event framing, settlement planning, PDA derivation and
# the deployment record.
solana = [
  "dep:anchor",
  "dep:solana-instruction",
  "dep:solana-message",
  "dep:solana-pubkey",
  "dep:solana-sdk-ids",
  "dep:serde_json",
  "dep:solana-cluster-type",
]
# The settlement input: a proven ARM transaction with its aggregation proof
# re-encoded as the verifier-router seal the adapter decodes.
arm = ["dep:anoma-rm-risc0", "dep:risc0-zkvm"]
# Submission: the forwarder registry each forwarder's client plugs into, and
# a settlement prepared and planned over an RPC.
rpc = [
  "solana",
  "arm",
  "dep:solana-rpc-client",
  "dep:solana-rpc-client-api",
  "dep:solana-signature",
  "dep:solana-transaction",
  "dep:solana-transaction-error",
  "dep:base64",
  "dep:thiserror",
]
# Estimate: a settlement run before it is proven, as pa-evm's integrators
# estimate `execute` with the verifier's code overridden.
estimate = [
  "rpc",
  "dep:litesvm",
  "dep:agave-feature-set",
  "dep:solana-program-runtime",
  "dep:solana-account",
  "dep:solana-clock",
  "dep:solana-feature-gate-interface",
  "dep:solana-loader-v3-interface",
]

# The cfgs `declare_program!`'s output tests: the Solana target, and the
# `idl-build` feature of a program crate, which this crate is not.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("idl-build"))'] }
