[package]
name = "anoma-pa-solana-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client bindings for the Solana Anoma Protocol Adapter and SPL Token Forwarder"
repository.workspace = true
readme = "../README.md"

[lib]
path = "src/lib.rs"

[dependencies]
# Pure deps — no Solana SDK, compile for any target including the risc0 guest.
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
base64 = "0.22"

# Solana SDK deps — used only by the on-chain instruction/PDA/program-id
# builders. Optional so that consumers needing only the pure wire-format and
# crypto modules (e.g. the zkVM transfer circuit, which compiles for
# riscv32im-risc0-zkvm-elf) can depend on this crate with `default-features =
# false`. These are the Solana crate versions the programs build with (Anchor
# 1.2): pubkey, instruction and sdk-ids 3.
solana-instruction = { version = "3", optional = true }
solana-pubkey = { version = "3", optional = true }
solana-sdk-ids = { version = "3", optional = true }
spl-associated-token-account-interface = { version = "2", optional = true }
spl-token-interface = { version = "3", optional = true }

[dev-dependencies]
# Reads the cross-package fixtures under `fixtures/`.
serde_json = "1.0"

[features]
default = ["solana"]
# Enables the modules that depend on the Solana SDK: instruction builders, PDA
# derivation, program IDs, and ATA helpers.
solana = [
  "dep:solana-instruction",
  "dep:solana-pubkey",
  "dep:solana-sdk-ids",
  "dep:spl-associated-token-account-interface",
  "dep:spl-token-interface",
]
