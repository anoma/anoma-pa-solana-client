[package]
name = "anoma-pa-solana-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client bindings for the Solana Anoma Protocol Adapter"
repository.workspace = true
readme = "../README.md"

[lib]
path = "src/lib.rs"

[dependencies]
# Pure deps — no Solana SDK, compile for any target including the risc0 guest.
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"

# Solana SDK deps — used only by the on-chain instruction/PDA/program-id
# builders. Optional so that consumers needing only the pure wire-format and
# crypto modules (e.g. the zkVM transfer circuit, which compiles for
# riscv32im-risc0-zkvm-elf) can depend on this crate with `default-features =
# false`. These are the Solana crate versions the programs build with (Anchor
# 1.2): pubkey, instruction and sdk-ids 3.
solana-compute-budget-interface = { version = "3", optional = true }
solana-instruction = { version = "3", optional = true }
# `curve25519`: PDA derivation (`Pubkey::find_program_address`).
solana-pubkey = { version = "3", optional = true, features = ["curve25519"] }
solana-sdk-ids = { version = "3", optional = true }

# The settlement input (`arm` feature): a proven ARM transaction in the form
# the adapter settles. Without the prover: no `prove` feature.
anoma-rm-risc0 = { version = "=2.0.0-rc.6", default-features = false, features = ["transaction"], optional = true }
risc0-zkvm = { version = "3.0.3", default-features = false, optional = true }

[dev-dependencies]
# Read the vendored IDL and the cross-package fixtures under `fixtures/`.
serde_json = "1.0"
base64 = "0.22"
# Proves trivial actions for the settlement-input tests.
anoma-pa-testkit = { version = "=1.0.0-rc.1", features = ["local", "fixtures"] }
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = ["solana"]
# Enables the modules that depend on the Solana SDK: instruction builders,
# settlement planning, PDA derivation and program IDs.
solana = [
  "dep:solana-compute-budget-interface",
  "dep:solana-instruction",
  "dep:solana-pubkey",
  "dep:solana-sdk-ids",
]
# The settlement input: a proven ARM transaction with its aggregation proof
# re-encoded as the verifier-router seal the adapter decodes.
arm = ["dep:anoma-rm-risc0", "dep:risc0-zkvm"]
